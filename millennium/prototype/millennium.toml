[plugin]
id = "dev.serfoch.steam-presence-bridge"
name = "Steam Presence Bridge (Launch Hook Test)"
version = "0.0.2"
author = "Serfoch"
description = "Experimental Steam game-launch event listener for Millennium"

[backend]
entry = "backend/main.lua"
sources = ["backend/**/*.lua"]

[frontend]
entry = "frontend/index.tsx"

[compiler]
output_path = "auto"

[dev]
auto_restart = true
reload_steamui_when = "both"

[patches]
debug = true
